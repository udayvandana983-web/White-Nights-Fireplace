<title>Breathbound — White Nights</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#000;overflow:hidden;width:100%;height:100%;
    overscroll-behavior:none;touch-action:manipulation;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent}
  #wrap{
    position:fixed;
    top:env(safe-area-inset-top,0px); bottom:env(safe-area-inset-bottom,0px);
    left:env(safe-area-inset-left,0px); right:env(safe-area-inset-right,0px);
    display:flex; align-items:center; justify-content:center;
    background:transparent;
  }
  #bg{
    position:absolute;
    max-width:none;
    max-height:none;
    pointer-events:none;
    display:block;
    user-select:none;
    -webkit-user-drag:none;
  }
  #bgBlur{
    position:fixed; inset:-60px;
    background-size:cover; background-position:center;
    filter:blur(38px) brightness(.55) saturate(.9);
    transform:scale(1.08);
  }
  #fireGL{
    position:absolute;
    left:0; top:0;
    pointer-events:none;
    mix-blend-mode:screen;
  }
  #start{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    color:#c9a27a;
    font-family:'Cormorant Garamond', system-ui, sans-serif;
    letter-spacing:.25em;
    background:rgba(0,0,0,.75);
    cursor:pointer;
    z-index:10;
  }
  #ctrls{
    position:fixed; z-index:7; display:none; gap:10px;
    right:calc(14px + env(safe-area-inset-right,0px));
    bottom:calc(14px + env(safe-area-inset-bottom,0px));
  }
  #ctrls button{
    width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(201,162,122,.3);background:rgba(0,0,0,.45);
    color:#c9a27a;font:600 13px/1 system-ui,sans-serif;opacity:.55;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  }
  #ctrls button:active{opacity:1}
  #resume{
    position:fixed; z-index:8; left:50%; transform:translateX(-50%);
    top:calc(18px + env(safe-area-inset-top,0px));
    padding:.65rem 1.2rem; border-radius:999px;
    background:rgba(20,10,4,.85); border:1px solid rgba(232,160,80,.45);
    color:#e8a050; font:14px system-ui,sans-serif; letter-spacing:.05em;
    display:none;
  }
  #start small{opacity:.7; letter-spacing:.12em; margin-top:.6rem; text-align:center; padding:0 1.5rem; line-height:1.5}
  #dbg{
    position:absolute;
    border:2px dashed rgba(255,0,0,.85);
    display:none;
    pointer-events:none;
    z-index:5;
  }
  #hud{
    position:fixed; z-index:6;
    left:calc(12px + env(safe-area-inset-left,0px));
    bottom:calc(70px + env(safe-area-inset-bottom,0px));
    max-width:min(560px,calc(100vw - 24px));
    padding:.7rem .9rem; border-radius:6px;
    background:rgba(0,0,0,.72); border:1px solid rgba(201,162,122,.25);
    color:#c9a27a; font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;
    display:none; pointer-events:none;
  }
</style>

<script>
const WINDOW_NORM = { x:0.321, y:0.761, w:0.360, h:0.162 };

const bg = document.getElementById("bg");
const cv = document.getElementById("fireGL");
const dbg = document.getElementById("dbg");
const gl = cv.getContext("webgl", {alpha:true, premultipliedAlpha:false});

let W=0, H=0;
function sizeToImage(){
  if(bg.naturalWidth){
    const wr = document.getElementById('wrap').getBoundingClientRect();
    const k = Math.min(wr.width/bg.naturalWidth, wr.height/bg.naturalHeight);
    bg.style.width  = Math.round(bg.naturalWidth*k)+'px';
    bg.style.height = Math.round(bg.naturalHeight*k)+'px';
  }
  const r = bg.getBoundingClientRect();
  const dpr = Math.min(devicePixelRatio||1, 2);
  W = Math.round(r.width * dpr);
  H = Math.round(r.height * dpr);
  cv.width = W; cv.height = H;
  cv.style.width = r.width+"px";
  cv.style.height = r.height+"px";
  const wr0 = document.getElementById('wrap').getBoundingClientRect();
  const ox = r.left - wr0.left, oy = r.top - wr0.top;   // offset inside #wrap
  cv.style.left = ox + "px";
  cv.style.top  = oy + "px";
  const bx = ox + r.width * WINDOW_NORM.x;
  const by = oy + r.height* WINDOW_NORM.y;
  const bw = r.width * WINDOW_NORM.w;
  const bh = r.height* WINDOW_NORM.h;
  dbg.style.left = bx+"px";
  dbg.style.top  = by+"px";
  dbg.style.width = bw+"px";
  dbg.style.height= bh+"px";
}
addEventListener("resize", sizeToImage);
if(window.visualViewport) visualViewport.addEventListener("resize", sizeToImage);
if(window.ResizeObserver) new ResizeObserver(()=>sizeToImage()).observe(document.getElementById("wrap"));
addEventListener("orientationchange", ()=>setTimeout(sizeToImage,300));

const vsrc = `
attribute vec2 a_pos;
varying vec2 v_uv;
void main(){
  v_uv = a_pos * .5 + .5;
  gl_Position = vec4(a_pos, 0., 1.);
}`;

const fsrc = `
precision highp float;
varying vec2 v_uv;
uniform float u_time;
uniform float u_intensity;
uniform float u_turbulence;
uniform float u_colorShift;
uniform vec4  u_fireRect;
uniform vec2  u_resolution;

vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
vec2 mod289(vec2 x){return x-floor(x*(1./289.))*289.;}
vec3 permute(vec3 x){return mod289(((x*34.)+1.)*x);}
float snoise(vec2 v){
  const vec4 C=vec4(.211324865405187,.366025403784439,-.577350269189626,.024390243902439);
  vec2 i=floor(v+dot(v,C.yy)); vec2 x0=v-i+dot(i,C.xx);
  vec2 i1=(x0.x>x0.y)?vec2(1.,0.):vec2(0.,1.);
  vec4 x12=x0.xyxy+C.xxzz; x12.xy-=i1; i=mod289(i);
  vec3 p=permute(permute(i.y+vec3(0.,i1.y,1.))+i.x+vec3(0.,i1.x,1.));
  vec3 m=max(.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.);
  m=m*m; m=m*m;
  vec3 x=2.*fract(p*C.www)-1.; vec3 h=abs(x)-.5; vec3 ox=floor(x+.5); vec3 a0=x-ox;
  m*=1.79284291400159-.85373472095314*(a0*a0+h*h);
  vec3 g; g.x=a0.x*x0.x+h.x*x0.y; g.yz=a0.yz*x12.xz+h.yz*x12.yw;
  return 130.*dot(m,g);
}
float fbm(vec2 p){
  float v=0.,a=.5;
  for(int i=0;i<4;i++){ v+=a*snoise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; }
  return v;
}
float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }

// Black-body style ramp: ember red -> orange -> yellow -> near white
vec3 fireRamp(float T){
  vec3 c = mix(vec3(0.), vec3(.38,.03,.0), smoothstep(.0,.22,T));
  c = mix(c, vec3(.92,.26,.02), smoothstep(.18,.48,T));
  c = mix(c, vec3(1.,.58,.10), smoothstep(.42,.72,T));
  c = mix(c, vec3(1.,.86,.52), smoothstep(.70,.93,T));
  c = mix(c, vec3(1.,.97,.86), smoothstep(.92,1.,T));
  return c;
}
// capsule distance (logs)
float sdCapsule(vec2 p, vec2 a, vec2 b, float r){
  vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);
  return length(pa-ba*h)-r;
}

void main(){
  vec2 uv = v_uv;
  float I = u_intensity;
  float t = u_time;
  float on = smoothstep(.005,.06,I);
  if(on <= 0.){ gl_FragColor = vec4(0.,0.,0.,1.); return; }

  vec2 fuv = (uv - u_fireRect.xy) / u_fireRect.zw;
  float asp = (u_fireRect.z*u_resolution.x)/(u_fireRect.w*u_resolution.y);
  float flick = .82 + .18*snoise(vec2(t*3.1,.3)) + .08*snoise(vec2(t*9.,1.7));

  // ── Light spilling onto the stove and bricks ──
  vec2 px = (uv - (u_fireRect.xy + vec2(.5*u_fireRect.z, .25*u_fireRect.w))) * vec2(u_resolution.x/u_resolution.y, 1.);
  float room = exp(-dot(px,px)*9.) * .10 + exp(-dot(px,px)*45.) * .16;
  vec2 fl2 = (uv - (u_fireRect.xy + vec2(.5*u_fireRect.z, -.02))) * vec2(u_resolution.x/u_resolution.y*.6, 2.2);
  room += exp(-dot(fl2,fl2)*60.) * .14 * step(uv.y, u_fireRect.y);
  vec3 spill = fireRamp(.55) * room * I * flick;

  bool inside = fuv.x>=0. && fuv.x<=1. && fuv.y>=0. && fuv.y<=1.;
  if(!inside){ gl_FragColor = vec4(spill*on, 1.); return; }

  float fx = fuv.x, fy = fuv.y;
  vec2 q = vec2(fx*asp, fy);
  float turb = u_turbulence;

  // ── Real logs in the photo (positions in firebox coordinates) ──
  const float LOG_TOP = .53;   // top of the log pile
  const float LOG_X0  = .07;
  const float LOG_X1  = .89;
  vec2 lp = vec2(fx*asp, fy);
  float logBox = smoothstep(LOG_X0-.02, LOG_X0+.06, fx) * smoothstep(LOG_X1+.02, LOG_X1-.06, fx)
               * smoothstep(LOG_TOP+.03, LOG_TOP-.08, fy) * smoothstep(.02, .12, fy);
  float embers = pow(max(0., snoise(lp*vec2(10.,16.) - vec2(t*.08,0.))), 2.);
  float pulse = .65 + .35*snoise(lp*3. + vec2(t*.7, 0.));
  // logs lit by the fire + glowing embers in their cracks

function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  let prev = Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){
    const cur=[i]; let rowMin=i;
    for(let j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if(cur[j]<rowMin) rowMin=cur[j];
    }
    if(rowMin>max) return max+1;
    prev=cur;
  }
  return prev[b.length];
}
function similar(a,b){
  if(!a||!b) return false;
  if(a===b) return true;
  const L=Math.min(a.length,b.length);
  if(L<3) return false;
  if(skel(a)===skel(b)) return true;
  if(L<4) return false;
  const m = L>=7 ? 2 : 1;
  return lev(a,b,m)<=m;
}

const LOOKAHEAD = 30;        // words ahead of our place we'll accept
const CONF_MAX   = 4.0;
const CONF_DECAY = 0.30;     // per second
const CONF_ON    = 0.75;     // ignite threshold
const CONF_OFF   = 0.25;     // extinguish threshold (hysteresis)
const EMBER      = 0.14;     // glow while on-script but pausing

let pos = -1;                // index in TOK just after last matched word (-1 = lost)
let misses = 0;
let conf = 0;
let onScript = false;
const recent = [];
const heardLog = [];         // for the debug HUD

function hit(x){ conf = Math.min(CONF_MAX, conf + x); misses = 0; }

function onWord(w){
  recent.push(w); if(recent.length>6) recent.shift();
  const stop = STOP.has(w);
  let ok = false;

  // 1. Follow along: full credit only for the NEXT few words, in order
  if(pos >= 0){
    const end = Math.min(TOK.length, pos + LOOKAHEAD);
    for(let j=pos; j<end; j++){
      const d = j - pos;                        // 0 = exactly the next word
      if(stop){ if(TOK[j]!==w || d>2) continue; }
      else if(!similar(w,TOK[j])) continue;
      let gain;
      if(stop)        gain = 0.15;
      else if(d<=2)   gain = (onScript || !light(w)) ? 0.6 : 0.15; // on track (filler can sustain, not ignite)
      else if(d<=8)   gain = (onScript || !light(w)) ? 0.25 : 0.05;               // skipped / misheard a few
      else            gain = 0.05;               // far ahead: move marker, barely trust it
      pos = j+1; hit(gain); ok = gain >= 0.25; break;
    }
  }

  // 2. Re-find our place: how many of the last words match the text
  //    consecutively, ending at this word? Short common phrases
  //    ("bottle of wine", "I will always") aren't enough to ignite.
  if(!ok && !stop && w.length>=3){
    const cands = IDX.get(w) || SKIDX.get(skel(w)) || [];
    let best=-1, bestRun=0, bestContent=0;
    for(const p of cands){
      let run=1, content = light(w) ? 0 : 1;
      while(run<6 && recent.length-1-run>=0 && similar(recent[recent.length-1-run], TOK[p-run])){
        if(!light(TOK[p-run])) content++;
        run++;
      }
      if(run<2) continue;
      const nearer = pos>=0 && best>=0 && Math.abs(p-pos) < Math.abs(best-pos);
      if(run>bestRun || (run===bestRun && nearer)){ best=p; bestRun=run; bestContent=content; }
    }
    if(best>=0){
      pos = best+1;
      // Ignite only on 3+ meaningful words in order; filler runs just mark our place
      hit(bestContent>=3 ? 1.0 : bestRun>=4 ? 0.45 : bestRun===3 ? 0.35 : 0.2);
      ok = true;
    }
    // 3. A signature word on its own
    else if(KEY.has(w)){ if(pos<0 && cands.length) pos = cands[0]+1; hit(0.8); ok = true; }
  }

  // 4. Recogniser split one word in two ("peters burg" → petersburg)
  if(!ok && recent.length>=2){
    const j = recent[recent.length-2] + w;
    if(KEY.has(j) || (pos>=0 && TOK.slice(pos, pos+3).some(t=>similar(j,t)))){
      if(pos<0 && IDX.has(j)) pos = IDX.get(j)[0]+1;
      hit(0.7); ok = true;
    }
  }

  if(!ok && !stop){
    misses++; conf = Math.max(0, conf - (onScript ? 0.25 : 0.12));
    if(misses > 6) pos = -1;
  }
  if(ok) pseudoVol = Math.min(0.12, pseudoVol + 0.05);
  heardLog.push({w, ok}); if(heardLog.length>24) heardLog.shift();
}

function norm(s){
  return s.toLowerCase().replace(/[’'`]/g,'').replace(/[^a-z\s]/g,' ').split(/\s+/).filter(Boolean);
}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null, recogWanted = false, recogState = 'off';
let recogLang = 'en-IN';          // Indian English copes better with the Hinglish lines
let processed = [];               // words already consumed per result index

function startRecog(){
  if(!SR){ recogState='unsupported'; return; }
  recog = new SR();
  recog.continuous = true;
  recog.interimResults = true;    // act on words as they're heard, not at sentence end
  recog.lang = recogLang;
  recog.maxAlternatives = 1;

  recog.onstart = () => { processed = []; recogState = 'listening'; hideResume(); };
  recog.onresult = (e) => {
    for(let i=e.resultIndex; i<e.results.length; i++){
      const words = norm(e.results[i][0].transcript);
      const done = processed[i] || 0;
      if(words.length < done){ processed[i] = words.length; continue; }
      for(let k=done; k<words.length; k++) onWord(words[k]);
      processed[i] = words.length;
    }
  };
  recog.onerror = (e) => {
    lastRecogErr = e.error;
    if(e.error==='not-allowed' || e.error==='service-not-allowed'){ recogWanted=false; recogState='blocked'; showResume('Speech recognition blocked — tap to retry'); }
    else if(e.error!=='no-speech' && e.error!=='aborted') console.warn('Speech error:', e.error);
  };
  recog.onend = () => {
    if(recogState!=='blocked') recogState = 'restarting';
    const wait = (lastRecogErr==='network' || lastRecogErr==='audio-capture') ? 1000 : 50;
    lastRecogErr = '';
    if(recogWanted) setTimeout(tryRestart, wait);
  };
  recogWanted = true;
  try{ recog.start(); }catch(_){}
}
// iOS often stops listening after a pause and won't restart without a tap.
let needTap = false, lastRecogErr = '';
const resumeEl = document.getElementById('resume');
function showResume(msg){ needTap = true; resumeEl.textContent = msg || 'Tap to resume listening'; resumeEl.style.display='block'; }
function hideResume(){ needTap = false; resumeEl.style.display='none'; }
function tryRestart(){
  try{ recog.start(); }catch(_){ }
  setTimeout(()=>{ if(recogWanted && recogState!=='listening') showResume(); }, 1500);
}
function resumeFromTap(){
  if(!recog) return;
  recogWanted = true; if(recogState==='blocked') recogState='restarting';
  try{ recog.start(); }catch(_){ }
  if(audioCtx && audioCtx.state!=='running') audioCtx.resume();
  requestWake();
  setTimeout(()=>{ if(recogState!=='listening') showResume(); }, 1500);
}

function switchLang(){
  recogLang = recogLang==='en-IN' ? 'en-US' : 'en-IN';
  document.getElementById('bLang').textContent = recogLang==='en-IN' ? 'IN' : 'US';
  if(recog){ recog.lang = recogLang; try{ recog.abort(); }catch(_){} } // onend restarts with new lang
}

let emotion='silence', frame=0, histClock=0;
let smoothTurb=1.0, smoothShift=0.0;
// If iOS gives the mic to speech recognition and our volume meter goes
// silent, drive the flame from recognised words instead.
let lastLiveVol = 0, micDead = false, pseudoVol = 0;
const VT = 0.002;

async function initAudio(){
  // Keep mic + playback together and ignore the ringer switch (Safari 17+)
  try{ if(navigator.audioSession) navigator.audioSession.type = 'play-and-record'; }catch(_){}
  audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  audioCtx.resume();
  const stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  const src = audioCtx.createMediaStreamSource(stream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.85;
  src.connect(analyser);
  timeData = new Uint8Array(analyser.fftSize);
  freqData = new Uint8Array(analyser.frequencyBinCount);
  listening=true;
}

// Voice-range autocorrelation (70–400 Hz), ~4x cheaper than before
function estimatePitch(){
  const sr = audioCtx.sampleRate, N = 512;
  const minLag = Math.floor(sr/400);
  const maxLag = Math.min(Math.floor(sr/70), timeData.length - N - 1);
  let best=-1, bestC=0;
  for(let o=minLag; o<=maxLag; o++){
    let c=0;
    for(let i=0;i<N;i++) c += Math.abs(timeData[i]-timeData[i+o]);
    c = 1 - c/(N*128);
    if(c>bestC){ bestC=c; best=o; }
  }
  if(bestC>.25 && best>0) pitch = sr/best;
}

function procAudio(dt){
  analyser.getByteTimeDomainData(timeData);
  analyser.getByteFrequencyData(freqData);

  let sum=0;
  for(let i=0;i<timeData.length;i++){const v=(timeData[i]-128)/128; sum+=v*v;}
  const vol=Math.sqrt(sum/timeData.length);
  if(vol > 0.0008) lastLiveVol = performance.now();
  micDead = performance.now() - lastLiveVol > 2500;
  sVol += (vol-sVol) * (1-Math.exp(-13*dt));

  if(frame%2===0) estimatePitch();
  sPitch += (pitch-sPitch) * (1-Math.exp(-6*dt));

  if(sVol>VT){ silence=0; speakTime = onScript ? Math.min(speakTime+dt,10) : Math.max(0,speakTime-3*dt); }
  else{ silence+=dt; speakTime=Math.max(0,speakTime-1.2*dt); }

  histClock += dt;
  if(histClock >= 0.05){           // 20 samples/sec regardless of display refresh
    histClock = 0;
    pitchHist.push(sPitch); volHist.push(sVol);
    let ws=0,te=0; for(let i=0;i<freqData.length;i++){ws+=i*freqData[i];te+=freqData[i];}
    specHist.push(te>0?ws/te:0);
    if(pitchHist.length>90){pitchHist.shift();volHist.shift();specHist.shift();}
  }
  detectEmo();
}

function detectEmo(){
  if(sVol<VT){emotion=silence>1.5?'silence':'fading';return;}
  const rp=pitchHist.slice(-30),rv=volHist.slice(-30),rs=specHist.slice(-30);
  if(rp.length<5){emotion='calm';return;}
  const avg=a=>a.reduce((s,v)=>s+v,0)/a.length;
  const std=(a,m)=>Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/a.length);
  const ap=avg(rp),av=avg(rv),as_=avg(rs),sp=std(rp,ap),sv=std(rv,av);
  if(av>.1&&sp>35&&as_>70)emotion='anger';
  else if(av>.05&&sp>20&&ap>185)emotion='joy';
  else if(av<.025&&ap<155&&sp<18)emotion='sadness';
  else if(sv>.025&&sp>28)emotion='fear';
  else if(av<.015)emotion='whisper';
  else emotion='calm';
}


// ── Fire sound (synthesised — no audio files) ──
const SOUND = { ignite: true, crackle: true, volume: 0.8 };   // tweak here
let master=null, noiseBuf=null, rumble=null, rumbleGain=null, muted=false, lastIgnite=-10;

function initSound(){
  master = audioCtx.createGain();
  master.gain.value = SOUND.volume;
  master.connect(audioCtx.destination);

  const len = audioCtx.sampleRate * 2;
  noiseBuf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;

  // low roaring bed that swells with the flame
  rumble = audioCtx.createBufferSource(); rumble.buffer = noiseBuf; rumble.loop = true;
  const lp = audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380; lp.Q.value=0.7;
  rumbleGain = audioCtx.createGain(); rumbleGain.gain.value = 0;
  rumble.connect(lp).connect(rumbleGain).connect(master);
  rumble.start();
}

function playIgnite(){
  if(!master || !SOUND.ignite || muted) return;
  const t = audioCtx.currentTime;
  if(t - lastIgnite < 3) return;          // don't stutter if it flickers on/off
  lastIgnite = t;

  // whoosh: filtered noise sweeping up then settling
  const n = audioCtx.createBufferSource(); n.buffer = noiseBuf;
  const bp = audioCtx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=0.9;
  bp.frequency.setValueAtTime(250, t);
  bp.frequency.exponentialRampToValueAtTime(1600, t+0.25);
  bp.frequency.exponentialRampToValueAtTime(500, t+1.4);
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.55, t+0.08);
  g.gain.exponentialRampToValueAtTime(0.0001, t+1.6);
  n.connect(bp).connect(g).connect(master);
  n.start(t, Math.random()); n.stop(t+1.7);

  // soft low thump as it catches
  const o = audioCtx.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(38, t+0.35);
  const og = audioCtx.createGain();
  og.gain.setValueAtTime(0.0001, t);
  og.gain.exponentialRampToValueAtTime(0.35, t+0.02);
  og.gain.exponentialRampToValueAtTime(0.0001, t+0.45);
  o.connect(og).connect(master); o.start(t); o.stop(t+0.5);

  // a burst of first crackles
  for(let i=0;i<7;i++) pop(t + 0.05 + Math.random()*0.6, 0.6 + Math.random()*0.4);
}

function pop(when, strength){
  const src = audioCtx.createBufferSource(); src.buffer = noiseBuf;
  const hp = audioCtx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = 1200 + Math.random()*3000;
  const g = audioCtx.createGain();
  const dur = 0.006 + Math.random()*0.03;
  g.gain.setValueAtTime(0.0001, when);
  g.gain.exponentialRampToValueAtTime(0.05 + 0.3*strength*Math.random(), when+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001, when+dur);
  src.connect(hp).connect(g).connect(master);
  src.start(when, Math.random()*1.9); src.stop(when+dur+0.01);
}

function updateSound(dt, intensity){
  if(!master) return;
  const on = SOUND.crackle && !muted;
  rumbleGain.gain.setTargetAtTime(on ? 0.09*intensity : 0, audioCtx.currentTime, 0.15);
  if(on && intensity > 0.05 && Math.random() < 9*intensity*dt) pop(audioCtx.currentTime, intensity);
}

function toggleMute(){
  muted = !muted;
  if(master) master.gain.setTargetAtTime(muted ? 0 : SOUND.volume, audioCtx.currentTime, 0.05);
}

// ── Debug HUD (press D) ──
const hud = document.getElementById('hud');
let hudOn = false;
function toggleDebug(){ hudOn=!hudOn; dbg.style.display = hudOn?'block':'none'; hud.style.display = hudOn?'block':'none'; }
document.getElementById('bDbg').addEventListener('click', e=>{ e.stopPropagation(); toggleDebug(); });
document.getElementById('bLang').addEventListener('click', e=>{ e.stopPropagation(); switchLang(); });
document.getElementById('bMute').addEventListener('click', e=>{ e.stopPropagation(); toggleMute();
  document.getElementById('bMute').textContent = muted ? '🔇' : '🔊'; });
document.addEventListener('keydown',(e)=>{
  const k = e.key.toLowerCase();
  if(k==='d') toggleDebug();
  if(k==='l') switchLang();
  if(k==='m') toggleMute();
});
function esc(s){ return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function drawHud(){
  if(!hudOn) return;
  const pct = Math.round(conf/CONF_MAX*100);
  const heard = heardLog.map(h=>`<span style="color:${h.ok?'#ffb35c':'#666'}">${esc(h.w)}</span>`).join(' ');
  let place = '<i style="opacity:.5">lost — start reading anywhere</i>';
  if(pos>=0){
    const a=Math.max(0,pos-8), b=Math.min(TOK.length,pos+10);
    place = TOK.slice(a,pos).join(' ') + ' <b style="color:#fff">▸</b> <span style="opacity:.55">' + TOK.slice(pos,b).join(' ') + '</span>';
  }
  hud.innerHTML =
    `<div>mic: ${micDead?'<span style="color:#e86">taken by speech — word-driven</span>':'live'}</div><div>speech: ${recogState} · ${recogLang} · voice: ${emotion} · sound: ${muted?'muted':'on'}</div>
     <div style="margin:.35rem 0;height:6px;background:#222;border-radius:3px;overflow:hidden">
       <div style="height:100%;width:${pct}%;background:${onScript?'#ff8a2a':'#555'}"></div></div>
     <div>${onScript?'🔥 on script':'· waiting for the text'} · ${pos>=0?`word ${pos}/${TOK.length}`:''}</div>
     <div style="margin-top:.35rem">${place}</div>
     <div style="margin-top:.35rem;opacity:.9">${heard}</div>`;
}

// ── Main loop ──
let lastTs = 0;
function animate(ts){
  requestAnimationFrame(animate);
  if(!listening) return;
  const dt = lastTs ? Math.min(0.1, (ts-lastTs)/1000) : 1/60;
  lastTs = ts;
  frame++;

  procAudio(dt);

  conf = Math.max(0, conf - CONF_DECAY*dt);
  if(!onScript && conf >= CONF_ON){ onScript = true; playIgnite(); }
  else if(onScript && conf < CONF_OFF) onScript = false;

  // Once the reader is on script, the flame follows the live voice instantly;
  // recognition only decides whether we're on script.
  pseudoVol *= Math.exp(-1.5*dt);
  const v = micDead ? pseudoVol : sVol;
  let target = 0;
  if(onScript){
    target = v > VT
      ? Math.min(1, Math.pow(v/0.08, 0.4)*0.6 + 0.25 + speakTime*0.015)
      : EMBER * Math.min(1, conf);
  }
  const rate = target > fl ? 6.0 : 1.1;
  fl += (target - fl) * (1 - Math.exp(-rate*dt));

  updateSound(dt, fl);

  const frx = WINDOW_NORM.x;
  const fry = 1.0 - (WINDOW_NORM.y + WINDOW_NORM.h);
  const frw = WINDOW_NORM.w;
  const frh = WINDOW_NORM.h;

  let tgtTurb=1.0, tgtShift=0.0;
  if(emotion==='anger'){tgtTurb=2.0;}
  else if(emotion==='joy'){tgtTurb=1.3;}
  else if(emotion==='sadness'){tgtTurb=.6;}
  else if(emotion==='fear'){tgtTurb=1.6;}
  else if(emotion==='whisper'){tgtTurb=.5;}
  const ek = 1 - Math.exp(-2.4*dt);
  smoothTurb += (tgtTurb - smoothTurb) * ek;
  smoothShift += (tgtShift - smoothShift) * ek;

  gl.viewport(0,0,cv.width,cv.height);
  gl.clearColor(0,0,0,0);
  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.uniform1f(uTime, ts/1000);
  gl.uniform1f(uIntensity, fl);
  gl.uniform1f(uTurb, smoothTurb);
  gl.uniform1f(uShift, smoothShift);
  gl.uniform4f(uRect, frx, fry, frw, frh);
  gl.uniform2f(uRes, cv.width, cv.height);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  if(frame % 12 === 0) drawHud();
}
setInterval(sizeToImage, 2000);

let started = false, wakeLock = null;
async function requestWake(){
  try{ if('wakeLock' in navigator && document.visibilityState==='visible' && !wakeLock){
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
  } }catch(_){}
}
document.addEventListener('visibilitychange', ()=>{
  if(!started || document.visibilityState!=='visible') return;
  requestWake();
  if(audioCtx && audioCtx.state!=='running') audioCtx.resume();
  setTimeout(()=>{ if(recogState!=='listening') showResume(); }, 800);
});
document.addEventListener('pointerdown', (e)=>{
  if(started && needTap && !e.target.closest('#ctrls')){ hideResume(); resumeFromTap(); }
});

const startEl = document.getElementById("start");
if(!SR){
  startEl.insertAdjacentHTML('beforeend','<small style="margin-top:1rem;color:#e86;max-width:80vw;text-align:center;line-height:1.5">Speech recognition isn\'t available here. On iPhone, turn on Settings → General → Keyboard → Enable Dictation, then reopen this page.</small>');
}
startEl.addEventListener("click", async ()=>{
  try{
    startRecog();          // start inside the tap — iOS needs a user gesture for this
    await initAudio();
    initSound();
    started = true;
    requestWake();
    document.getElementById('ctrls').style.display = 'flex';
    startEl.style.display="none";
    sizeToImage();
    requestAnimationFrame(animate);
  }catch(e){
    startEl.innerHTML = "<div>Microphone permission required</div><small>Check browser settings</small>";
  }
});

function setBlur(){ document.getElementById("bgBlur").style.backgroundImage = `url(${bg.src})`; }
bg.addEventListener("load", ()=>{ setBlur(); sizeToImage(); });
if(bg.complete){ setBlur(); sizeToImage(); }
</script>
